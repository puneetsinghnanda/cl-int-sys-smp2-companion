schema: workflow.v1
id: brownfield-change
version: 1.3.0
title: Brownfield change
description: Take a ticket on an existing system from requirement to a reviewed pull
  request.
owner: wf-owner-2b
kind: delivery
status: draft
requires_fresh_pack: true
inputs:
  ticket:
    required: true
defaults:
  retry:
    checks: 2
    review: 2
    verifier: 3
  max_rework: 2
steps:
- id: req
  skill: requirement-review@1.0.0
  inputs:
    ticket: run.ticket
    intent_baseline: context.intent-baseline
- id: split
  skill: story-split@1.0.1
  after:
  - req
  inputs:
    intent: req.intent
- id: impact
  skill: impact-analysis@1.1.1
  after:
  - req
  inputs:
    intent: req.intent
- id: design
  skill: design@1.4.1
  after:
  - split
  - impact
  inputs:
    impact: impact.impact
    stories: split.stories
    intent: req.intent
- id: threat
  skill: threat-model@1.0.1
  after:
  - design
  inputs:
    design: design.design
- id: impl
  skill: implement@1.0.1
  after:
  - threat
  inputs:
    design: design.design
    stories: split.stories
- id: ut
  skill: unit-test@1.0.1
  after:
  - impl
  inputs:
    change: impl.change
    stories: split.stories
- id: secrev
  skill: secure-code-review@1.0.1
  after:
  - impl
  inputs:
    change: impl.change
- id: tplan
  skill: test-plan@1.0.1
  after:
  - design
  inputs:
    stories: split.stories
    design: design.design
- pr: true
  after:
  - ut
  - secrev
  - tplan
  draft_when_band: Medium
  repos: changed
