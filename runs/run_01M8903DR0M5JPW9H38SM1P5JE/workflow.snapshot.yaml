schema: workflow.v1
id: brownfield-small
version: 1.0.0
title: Brownfield change (small)
description: Take a small ticket on an existing system (one story; no schema, auth,
  new-service or shared-contract change) from requirement to a reviewed pull request.
owner: wf-owner-2b
kind: delivery
status: draft
requires_fresh_pack: true
inputs:
  ticket:
    required: true
defaults:
  retry:
    checks: 2
    review: 2
    verifier: 3
    write: 4
  max_rework: 2
steps:
- id: req
  skill: requirement-review@1.5.0
  inputs:
    ticket: run.ticket
    intent_baseline: context.intent-baseline
- id: split
  skill: story-split@1.5.0
  after:
  - req
  inputs:
    intent: req.intent
- id: design
  skill: design@1.10.0
  after:
  - split
  inputs:
    stories: split.stories
    intent: req.intent
- id: impl
  skill: implement@1.4.0
  after:
  - design
  inputs:
    design: design.design
    stories: split.stories
- id: ut
  skill: unit-test@1.4.0
  after:
  - impl
  inputs:
    change: impl.change
    stories: split.stories
- id: secrev
  skill: secure-code-review@1.4.0
  after:
  - impl
  inputs:
    change: impl.change
- pr: true
  after:
  - ut
  - secrev
  draft_when_band: Medium
  repos: changed
