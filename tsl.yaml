schema: tsl-config.v1
system:
  code: SYS-SMP2
  project: PRJ-SMP
  client: CL-INT
companion:
  repo: puneetsinghnanda/cl-int-sys-smp2-companion
  default_branch: main
product_repos:
- name: sample-system
  url: https://github.com/puneetsinghnanda/sample-health-mgmt-app.git
  path: .
  default_branch: main
  verifier_profile: node-22@1
gates:
  self_approval: false
  lock_timeout_hours: 24
pr:
  branch_prefix: tsl/
  labels:
  - truminds
telemetry:
  enabled: true
context:
  max_commits_behind: 50
  drift_files: 50
  critical_paths:
    - "sample-system:db/migrations/**"
    - "sample-system:api/src/auth/**"
  extractors:
    migrations: ["db/migrations/*.sql"]
change_limits:
  lines: 400
  files: 15
  sensitive_paths: ["**/auth/**", "**/migrations/**", ".github/**"]
